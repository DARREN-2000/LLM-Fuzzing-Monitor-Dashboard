[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fuzz-monitor"
version = "3.0.0"
description = "AI-driven fuzz-testing toolkit that benchmarks LLM-generated fuzz drivers for C/C++ projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Morris Darren Babu" },
]
keywords = [
    "fuzzing",
    "llm",
    "security-testing",
    "code-analysis",
    "ci-cd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "psutil>=5.9,<6.0",
    "numpy>=1.24,<2.0",
    "requests>=2.31,<3.0",
    "PyYAML>=6.0,<7.0",
    "portalocker>=2.7,<3.0",
    "rich>=13.0,<14.0",
    "click>=8.1,<9.0",
    "watchdog>=3.0,<5.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0,<2.0",
    "anthropic>=0.18,<1.0",
]
docker = [
    "docker>=7.0,<8.0",
]
perf = [
    "lz4>=4.3,<5.0",
    "ujson>=5.8,<6.0",
    "aiofiles>=23.0,<24.0",
    "scipy>=1.11,<2.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-mock>=3.12,<4.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.3,<1.0",
    "mypy>=1.8,<2.0",
    "build>=1.0,<2.0",
]

[project.urls]
Repository = "https://github.com/DARREN-2000/llm-integration"

[project.scripts]
llm-fuzz-monitor = "llm_fuzz_monitor.experiments.monitor:main"

[tool.setuptools.packages.find]
include = ["llm_fuzz_monitor*"]

# ── Ruff ────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length handled by formatter
    "B904",   # raise from inside except
    "SIM108", # ternary operator
]

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that take a long time to run",
    "integration: marks integration tests that need external services",
]

# ── Coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["llm_fuzz_monitor"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50

# ── mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
