# LLM Fuzz Monitor — Free Local Demo Stack
# Runs on CPU-only hosts with minimal setup.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  monitor:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_ENDPOINT=http://ollama:11434
    volumes:
      - ./config:/workspace/config:ro
      - ./results:/workspace/results
      - ./experiments:/workspace/experiments
    command: ["--config", "/workspace/config/config.yaml"]

volumes:
  ollama_data:
